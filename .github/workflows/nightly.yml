name: Nightly Tests

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Test with Rust nightly
  nightly:
    name: Nightly Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-nightly-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-nightly-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace --all-features
        continue-on-error: true

      - name: Check for future incompatibilities
        run: cargo check --workspace --all-features -Z future-incompat-report
        continue-on-error: true

  # Test with MSRV (Minimum Supported Rust Version)
  msrv:
    name: MSRV Check (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-msrv-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-msrv-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Check compilation with MSRV
        run: cargo check --workspace --all-features

      - name: Run tests with MSRV
        run: cargo test --workspace --all-features

  # Test with minimal dependency versions
  minimal-versions:
    name: Minimal Dependency Versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-minimal-versions
        run: cargo install cargo-minimal-versions

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-minimal-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Test with minimal versions
        run: cargo minimal-versions check --workspace --all-features
        continue-on-error: true

  # Fuzz testing (if you have fuzz targets)
  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    if: false  # Enable this when you add fuzz targets
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzz tests
        run: |
          cd fuzz
          cargo fuzz run model_input -- -max_total_time=300
        timeout-minutes: 10
        continue-on-error: true

  # Notify on failure
  notify-failure:
    name: Notify on Failure
    needs: [nightly, msrv, minimal-versions]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔴 Nightly Tests Failed',
              body: `The nightly CI run has failed. Please check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`,
              labels: ['ci-failure', 'needs-triage']
            })
