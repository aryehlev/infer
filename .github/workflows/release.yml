name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build release artifacts for multiple platforms
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --workspace --all-features

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Copy artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/libinfer_lib.rlib artifacts/ || true
          cp target/${{ matrix.target }}/release/libinfer_pipeline.rlib artifacts/ || true

      - name: Copy artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item target/${{ matrix.target }}/release/infer_lib.lib artifacts/ -ErrorAction SilentlyContinue
          Copy-Item target/${{ matrix.target }}/release/infer_pipeline.lib artifacts/ -ErrorAction SilentlyContinue

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*

  # Publish to crates.io (manual approval required)
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'release'
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish infer-lib
        run: cargo publish --package infer-lib --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Wait for crates.io to update
        run: sleep 30

      - name: Publish infer-pipeline
        run: cargo publish --package infer-pipeline --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

  # Build and publish documentation
  publish-docs:
    name: Publish Documentation
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps

      - name: Add index.html redirect
        run: echo '<meta http-equiv="refresh" content="0; url=infer_lib">' > target/doc/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
          cname: docs.example.com  # Update with your custom domain if any
