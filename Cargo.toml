[workspace]
members = [
    "lib",
    "pipeline",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/aryehlev/infer-lib"
rust-version = "1.85"

[workspace.dependencies]
# Core dependencies
arc-swap = "1.7"
thiserror = "2.0"
rayon = "1.10"

# Polars support
polars = { version = "0.45", features = ["lazy", "dtype-full"] }

# ML backends - using local paths for development
catboost-rust = { path = "../catboost-rust", features = ["polars"] }
xgboost-rust = { path = "../xgboost-rust", features = ["polars"] }
lightgbm-rust = { path = "../lightgbm-rust", features = ["polars"] }

# Perpetual gradient boosting
perpetual = "0.4"

# ONNX Runtime
ort = { version = "2.0.0-rc.10", features = ["half"] }

# Candle for transformers/LLMs
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"

# Supporting libraries
image = "0.25"
tokenizers = "0.20"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
